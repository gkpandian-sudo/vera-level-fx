name: Fetch Vera Snapshot

on:
  schedule:
    # Daily at 21:30 UTC = 05:30 AM SGT (30 min before the 06:00 AM post)
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch snapshot
        env:
          MYFX_EMAIL:    ${{ secrets.MYFX_EMAIL }}
          MYFX_PASSWORD: ${{ secrets.MYFX_PASSWORD }}
        run: python fetch_snapshot.py

      - name: Commit and push
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add data/vera-snapshot.json
          git diff --cached --quiet || git commit -m "data: update vera-snapshot $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin master
          git push origin master
