name: Fetch Vera Snapshot

on:
  schedule:
    # Every day 05:30 SGT = 21:30 UTC (1.5h before the reel post at 23:00 UTC)
    - cron: '30 21 * * *'
  workflow_dispatch:

# One fetch at a time — avoids concurrent git pushes to data/vera-snapshot.json
concurrency:
  group: fetch-snapshot
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch snapshot
        env:
          MYFX_EMAIL:    ${{ secrets.MYFX_EMAIL }}
          MYFX_PASSWORD: ${{ secrets.MYFX_PASSWORD }}
        run: python fetch_snapshot.py

      - name: Commit and push
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add data/vera-snapshot.json
          git diff --cached --quiet || git commit -m "data: update vera-snapshot $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin master
          git push origin master
