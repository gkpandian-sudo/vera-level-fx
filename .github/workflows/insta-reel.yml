name: Instagram Reel Auto-Post

on:
  schedule:
    # Every day 07:00 SGT = 23:00 UTC previous day
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      post_type:
        description: 'weekly|monthly|daily|trust|edu|transparency|recovery-plan|broker'
        required: false
        default: 'weekly'
      post_lang:
        description: 'Caption language (en|tamil|hindi)'
        required: false
        default: 'en'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: instagram/requirements.txt

      - name: Install dependencies
        run: pip install -r instagram/requirements.txt

      # Scheduled runs rotate by day — one post type per day of the week.
      # Cron fires 23:00 UTC = 07:00 SGT next day.
      - name: Resolve post type
        id: post_type
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "$(date -u +%u)" in
              7) echo "type=weekly"        >> "$GITHUB_OUTPUT" ;;  # Sun UTC -> Mon SGT
              1) echo "type=monthly"       >> "$GITHUB_OUTPUT" ;;  # Mon UTC -> Tue SGT
              2) echo "type=daily"         >> "$GITHUB_OUTPUT" ;;  # Tue UTC -> Wed SGT
              3) echo "type=edu"           >> "$GITHUB_OUTPUT" ;;  # Wed UTC -> Thu SGT
              4) echo "type=trust"         >> "$GITHUB_OUTPUT" ;;  # Thu UTC -> Fri SGT
              5) echo "type=transparency"  >> "$GITHUB_OUTPUT" ;;  # Fri UTC -> Sat SGT
              6) echo "type=recovery-plan" >> "$GITHUB_OUTPUT" ;;  # Sat UTC -> Sun SGT
              *) echo "type=weekly"        >> "$GITHUB_OUTPUT" ;;
            esac
          else
            echo "type=${{ github.event.inputs.post_type || 'weekly' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Reel & post to Instagram
        env:
          IG_USER_ID:        ${{ secrets.IG_USER_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          GITHUB_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          POST_TYPE:         ${{ steps.post_type.outputs.type }}
          POST_LANG:         ${{ github.event.inputs.post_lang || 'en' }}
          RECOVERY_START:    ${{ secrets.RECOVERY_START }}
          BRAND_IB_URL:      ${{ secrets.BRAND_IB_URL }}
        run: python instagram/run_reel.py

      - name: Upload reel artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-reel-${{ github.run_id }}
          path: instagram/reels/
          retention-days: 14
