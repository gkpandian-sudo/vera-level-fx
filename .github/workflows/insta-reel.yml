name: Instagram Reel Auto-Post

on:
  schedule:
    # Daily rotation 07:00 SGT = 23:00 UTC previous day
    - cron: '0 23 * * *'
    # Broker spotlight: 1st of each month 07:00 SGT = 23:00 UTC last day of prev month
    - cron: '0 23 1 * *'
  workflow_dispatch:
    inputs:
      post_type:
        description: 'weekly|monthly|daily|trust|edu|transparency|recovery-plan|broker'
        required: false
        default: 'weekly'
      post_lang:
        description: 'Caption language (en|tamil|hindi)'
        required: false
        default: 'en'

# Prevent concurrent runs on the same branch — avoids git push conflicts
# and double-posting to Instagram if schedule + dispatch overlap.
concurrency:
  group: instagram-reel
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: instagram/requirements.txt

      - name: Install dependencies
        run: pip install -r instagram/requirements.txt

      # FIX: post_type input is passed via env var, NOT interpolated directly into shell,
      # preventing shell injection from workflow_dispatch inputs.
      - name: Resolve post type
        id: post_type
        env:
          INPUT_POST_TYPE: ${{ github.event.inputs.post_type || 'weekly' }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            # Monthly broker cron fires on the 1st — separate from daily rotation
            if [ "$EVENT_SCHEDULE" = "0 23 1 * *" ]; then
              echo "type=broker" >> "$GITHUB_OUTPUT"
            else
              case "$(date -u +%u)" in
                7) echo "type=weekly"        >> "$GITHUB_OUTPUT" ;;  # Sun UTC -> Mon SGT
                1) echo "type=monthly"       >> "$GITHUB_OUTPUT" ;;  # Mon UTC -> Tue SGT
                2) echo "type=daily"         >> "$GITHUB_OUTPUT" ;;  # Tue UTC -> Wed SGT
                3) echo "type=edu"           >> "$GITHUB_OUTPUT" ;;  # Wed UTC -> Thu SGT
                4) echo "type=trust"         >> "$GITHUB_OUTPUT" ;;  # Thu UTC -> Fri SGT
                5) echo "type=transparency"  >> "$GITHUB_OUTPUT" ;;  # Fri UTC -> Sat SGT
                6) echo "type=recovery-plan" >> "$GITHUB_OUTPUT" ;;  # Sat UTC -> Sun SGT
                *) echo "type=weekly"        >> "$GITHUB_OUTPUT" ;;
              esac
            fi
          else
            # Validate allowed values; reject anything else to block injection attempts
            case "$INPUT_POST_TYPE" in
              weekly|monthly|daily|trust|edu|transparency|recovery-plan|broker)
                echo "type=$INPUT_POST_TYPE" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "ERROR: Invalid post_type '$INPUT_POST_TYPE'" >&2
                exit 1
                ;;
            esac
          fi

      - name: Generate Reel & post to Instagram
        env:
          IG_USER_ID:        ${{ secrets.IG_USER_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          GITHUB_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          POST_TYPE:         ${{ steps.post_type.outputs.type }}
          POST_LANG:         ${{ github.event.inputs.post_lang || 'en' }}
          RECOVERY_START:    ${{ secrets.RECOVERY_START }}
          BRAND_IB_URL:      ${{ secrets.BRAND_IB_URL }}
        run: python instagram/run_reel.py

      - name: Upload reel artifact
        if: success()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: instagram-reel-${{ github.run_id }}
          path: instagram/reels/
          retention-days: 14
