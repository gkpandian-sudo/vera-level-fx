name: Instagram Auto-Post

on:
  schedule:
    # Daily 06:00 SGT = 22:00 UTC previous day (SGT is UTC+8, post fires the UTC night before)
    # Post type is decided by run.py: monthly (1st) > weekly (Mon) > edu (Tue) > daily (all other days)
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      post_type:
        description: 'Post type (weekly | monthly | daily | trust | edu | transparency | recovery-plan)'
        required: false
        default: 'weekly'
      post_lang:
        description: 'Caption language (en | tamil)'
        required: false
        default: 'en'

# One static image post at a time to avoid git push conflicts
concurrency:
  group: instagram-post
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: instagram/requirements.txt

      - name: Install dependencies
        run: pip install -r instagram/requirements.txt

      - name: Generate image & post to Instagram
        env:
          IG_USER_ID:        ${{ secrets.IG_USER_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          GITHUB_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          POST_TYPE:         ${{ github.event.inputs.post_type }}
          POST_LANG:         ${{ github.event.inputs.post_lang }}
          RECOVERY_START:    ${{ secrets.RECOVERY_START }}
          BRAND_TELEGRAM:    ${{ secrets.BRAND_TELEGRAM }}
          BRAND_WEBSITE:     ${{ secrets.BRAND_WEBSITE }}
          BRAND_IB_URL:      ${{ secrets.BRAND_IB_URL }}
          BRAND_AUTHOR:      ${{ secrets.BRAND_AUTHOR }}
          BRAND_SIGNAL_CTA:  ${{ secrets.BRAND_SIGNAL_CTA }}
          BRAND_DOMAIN:      ${{ secrets.BRAND_DOMAIN }}
        run: python instagram/run.py

      - name: Upload image artifact
        if: success()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: instagram-post-${{ github.run_id }}
          path: instagram/posts/
          retention-days: 30
