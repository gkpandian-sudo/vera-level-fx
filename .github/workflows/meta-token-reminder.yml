name: META Token Renewal Reminder

on:
  schedule:
    # Fires 1st of every month at 09:00 SGT (01:00 UTC).
    # META_ACCESS_TOKEN expires every 60 days -- renew every 45 days.
    - cron: "0 1 1 * *"
  workflow_dispatch:

jobs:
  remind:
    name: Send Telegram reminder
    runs-on: ubuntu-latest
    steps:
      - name: Send META_ACCESS_TOKEN renewal reminder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TEXT=$'META_ACCESS_TOKEN Renewal Due\n\nYour Instagram Meta API token expires every 60 days.\nRenew it NOW to keep @veralevel.fx posting automatically.\n\nSteps (5 min):\n1. Go to: developers.facebook.com/tools/explorer\n2. Generate User Token: instagram_basic, instagram_content_publish, pages_read_engagement\n3. Exchange for a long-lived token (valid 60 days)\n4. Update secret META_ACCESS_TOKEN at:\n   github.com/gkpandian-sudo/vera-level-fx -> Settings -> Secrets -> Actions\n5. Test: gh workflow run insta-post.yml --field post_type=trust\n\nDo this within 15 days to avoid any posting outage.\n-- Vera Level FX Auto-Reminder'
          curl -s -X POST             "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"             --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}"             --data-urlencode "text=${TEXT}"
