name: META Token Renewal Reminder

on:
  schedule:
    # Fires 1st of every month at 09:00 SGT (01:00 UTC).
    # META_ACCESS_TOKEN expires every 60 days -- renew every 45 days.
    - cron: '0 1 1 * *'
  workflow_dispatch:

jobs:
  remind:
    name: Send Telegram reminder
    runs-on: ubuntu-latest
    steps:
      - name: Send META_ACCESS_TOKEN renewal reminder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 << 'PYEOF'
          import os, json, urllib.request
          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          lines = [
              "META_ACCESS_TOKEN Renewal Due",
              "",
              "Your Instagram Meta API token expires every 60 days.",
              "Renew it NOW to keep @veralevel.fx posting automatically.",
              "",
              "Steps (5 min):",
              "1. Go to: developers.facebook.com/tools/explorer",
              "2. Generate User Token with: instagram_basic, instagram_content_publish, pages_read_engagement",
              "3. Exchange for a long-lived token (valid 60 days)",
              "4. Update META_ACCESS_TOKEN in GitHub:",
              "   github.com/gkpandian-sudo/vera-level-fx -> Settings -> Secrets -> Actions",
              "5. Test: gh workflow run insta-post.yml --field post_type=trust",
              "",
              "Do this within 15 days to avoid any posting outage.",
              "-- Vera Level FX Auto-Reminder",
          ]
          data = json.dumps({"chat_id": chat_id, "text": "
".join(lines)}).encode()
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=data,
              headers={"Content-Type": "application/json"},
          )
          print(urllib.request.urlopen(req).read().decode())
          PYEOF
